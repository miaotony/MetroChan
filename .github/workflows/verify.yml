name: Verify MetroChan

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the tested dist to GitHub Pages (main only)
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Test dist at /
        run: npm run test:e2e
        env:
          TEST_SITE: dist
          TEST_PREFIX: /
      - name: Test dist at /MetroChan/
        run: npm run test:e2e
        env:
          TEST_SITE: dist
          TEST_PREFIX: /MetroChan/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Package the tested dist for Pages
        if: inputs.deploy_pages && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: verify
    if: inputs.deploy_pages && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
