name: Verify MetroChan

on:
  workflow_dispatch:
    inputs:
      upload_offline:
        description: Attach the verified offline HTML for download
        type: boolean
        required: false
        default: true
      deploy_pages:
        description: Deploy the tested dist to GitHub Pages (main only)
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check web and offline outputs are separate
        run: |
          test -s dist/index.html
          test -s release/MetroChan-offline.html
          test -z "$(find dist -name MetroChan-offline.html -print -quit)"
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Test dist at /
        run: npm run test:e2e
        env:
          TEST_SITE: dist
          TEST_PREFIX: /
      - name: Test dist at /MetroChan/
        run: npm run test:e2e
        env:
          TEST_SITE: dist
          TEST_PREFIX: /MetroChan/
      - name: Test the standalone offline HTML
        shell: bash
        run: npm run test:offline -- --trace=retain-on-failure 2>&1 | tee offline-test.log
      - name: Attach the verified offline HTML
        if: success() && inputs.upload_offline
        uses: actions/upload-artifact@v4
        with:
          name: MetroChan-offline
          path: release/MetroChan-offline.html
          retention-days: 7
          if-no-files-found: error
      - name: Package the tested dist for Pages
        if: inputs.deploy_pages && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: |
            test-results/
            playwright-report/
            offline-test.log
          retention-days: 7
          if-no-files-found: ignore

  deploy-pages:
    needs: verify
    if: inputs.deploy_pages && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
